<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中英文單字隨身卡 - 護眼大字版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            touch-action: manipulation;
        }
        .perspective-1000 {
            perspective: 1200px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-sky-50 to-emerald-100 min-h-screen text-slate-900 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- 頂部導覽列 -->
    <header class="bg-white/95 backdrop-blur-md shadow-md sticky top-0 z-50 px-5 py-4 flex justify-between items-center border-b border-indigo-100">
        <div class="flex items-center space-x-3">
            <span class="bg-indigo-600 text-white text-sm font-black px-3 py-1.5 rounded-2xl shadow-sm">高中英文</span>
            <h1 class="font-black text-xl text-indigo-950 tracking-tight">隨身字卡大字版</h1>
        </div>
        <div class="flex items-center space-x-2">
            <span id="counter" class="text-base font-bold text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-2xl border border-indigo-200">1 / 70</span>
            <button onclick="toggleFavoritesView()" id="fav-filter-btn" class="text-sm px-3.5 py-1.5 bg-amber-100 text-amber-800 rounded-2xl font-bold transition hover:bg-amber-200 shadow-sm">★ 收藏</button>
            <button onclick="openSpellingModal()" class="text-sm px-3.5 py-1.5 bg-emerald-600 text-white rounded-2xl font-bold transition hover:bg-emerald-700 shadow-sm flex items-center gap-1">✏️ 拼字</button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-lg w-full mx-auto p-5 flex flex-col justify-center items-center">

        <!-- 搜尋與快速操作列 -->
        <div class="w-full mb-5 flex gap-3">
            <div class="relative flex-1">
                <input type="text" id="search-input" placeholder="🔍 輸入英文單字或中文..." oninput="handleSearch(this.value)" class="w-full px-5 py-3.5 bg-white border-2 border-indigo-100 rounded-2xl text-base font-medium shadow-sm focus:outline-none focus:border-indigo-500 transition">
            </div>
            <button onclick="toggleAutoPlay()" id="autoplay-btn" class="bg-white border-2 border-indigo-100 text-indigo-700 px-4 py-3.5 rounded-2xl font-bold shadow-sm hover:bg-indigo-50 transition flex items-center gap-1 shrink-0" title="自動循環朗讀">
                <span>▶ 循環</span>
            </button>
        </div>

        <!-- 3D 翻轉字卡 (放大字體) -->
        <div class="w-full aspect-[4/4.8] perspective-1000 cursor-pointer select-none" onclick="flipCard()">
            <div id="flashcard" class="relative w-full h-full duration-500 transform-style-3d shadow-2xl rounded-3xl bg-white border-2 border-indigo-50">
                
                <!-- 正面：超大單字、詞性、音標 -->
                <div class="absolute inset-0 backface-hidden p-8 flex flex-col justify-between bg-gradient-to-br from-white via-white to-indigo-50/50 rounded-3xl">
                    <div class="flex justify-between items-center">
                        <span id="card-pos" class="px-4 py-1.5 bg-indigo-100 text-indigo-800 rounded-2xl text-sm font-black uppercase tracking-wider">n.</span>
                        <button onclick="event.stopPropagation(); toggleFavorite();" id="fav-btn" class="text-4xl text-slate-300 hover:text-amber-400 transition p-1">★</button>
                    </div>
                    <div class="text-center my-auto">
                        <!-- 點擊生字或喇叭圖示即可發音 -->
                        <div onclick="event.stopPropagation(); speakCurrentWord();" class="inline-flex items-center justify-center gap-3 group cursor-pointer p-3 rounded-2xl hover:bg-indigo-50/80 transition">
                            <h2 id="card-word" class="text-5xl md:text-6xl font-black text-slate-900 tracking-tight drop-shadow-sm group-hover:text-indigo-600 transition">collect</h2>
                            <span class="text-3xl text-indigo-500 bg-indigo-100/80 p-2.5 rounded-2xl shadow-xs group-hover:scale-110 transition">🔊</span>
                        </div>
                        <p id="card-phonetic" class="text-indigo-600 font-mono text-xl font-bold mt-2">[kə`lɛkt]</p>
                        <div class="mt-6 inline-flex items-center space-x-2 text-sm text-indigo-500 font-semibold bg-indigo-50/80 px-4 py-2 rounded-2xl shadow-xs border border-indigo-100">
                            <span>👆 點擊單字聽發音 ｜ 卡片空白處翻背面</span>
                        </div>
                    </div>
                    <div class="text-center text-sm font-semibold text-slate-400">
                        正面 (點擊卡片其他地方看中文與例句)
                    </div>
                </div>

                <!-- 背面：超大中文意義與完整例句 -->
                <div class="absolute inset-0 backface-hidden rotate-y-180 p-8 flex flex-col justify-between bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white rounded-3xl overflow-y-auto">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-indigo-300 uppercase tracking-wider">中文釋義與例句解析</span>
                        <span class="text-xs font-medium text-indigo-300/70">點擊例句可聽朗讀</span>
                    </div>
                    <div class="my-auto space-y-6">
                        <div>
                            <h3 id="card-meaning" class="text-3xl font-black text-emerald-400 tracking-tight mb-2">收集；聚集</h3>
                        </div>
                        <!-- 點擊例句區塊即可朗讀例句 -->
                        <div onclick="event.stopPropagation(); speakSentence();" class="bg-white/10 p-5 rounded-2xl backdrop-blur-md border border-white/15 shadow-inner cursor-pointer hover:bg-white/15 transition group">
                            <div class="flex items-start justify-between gap-3">
                                <p id="card-sentence-en" class="text-base md:text-lg font-semibold text-slate-100 mb-3 leading-relaxed group-hover:text-emerald-300 transition">Jeff has the habit of collecting Japanese comic books.</p>
                                <span class="text-2xl shrink-0">🔊</span>
                            </div>
                            <p id="card-sentence-zh" class="text-sm font-medium text-indigo-200 leading-relaxed">(Jeff 有收集日本漫畫書的習慣。)</p>
                        </div>
                    </div>
                    <div class="text-center text-sm font-semibold text-indigo-300/80">
                        背面 (點擊任意處翻回正面)
                    </div>
                </div>

            </div>
        </div>

        <!-- 底部大按鈕導覽控制器 -->
        <div class="w-full flex items-center justify-between mt-6 gap-3">
            <button onclick="prevCard()" class="flex-1 py-4 bg-white border-2 border-indigo-100 shadow-md rounded-2xl font-bold text-base text-slate-700 hover:bg-indigo-50 active:scale-95 transition flex items-center justify-center space-x-1">
                <span>← 上一個</span>
            </button>
            <button onclick="nextCard()" class="flex-1 py-4 bg-indigo-600 text-white shadow-lg shadow-indigo-300 rounded-2xl font-black text-lg hover:bg-indigo-700 active:scale-95 transition flex items-center justify-center space-x-1">
                <span>下一個 →</span>
            </button>
        </div>

    </main>

    <!-- 拼字練習彈跳視窗 (Modal) -->
    <div id="spelling-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl border border-indigo-100 flex flex-col justify-between">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-black text-indigo-950">✏️ 單字拼字練習</h3>
                <button onclick="closeSpellingModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold px-2">&times;</button>
            </div>
            
            <div id="spelling-content" class="my-4 space-y-5">
                <div class="text-center bg-indigo-50 p-6 rounded-2xl border border-indigo-100">
                    <p class="text-xs font-bold text-indigo-600 uppercase tracking-wider mb-1">請根據中文意思拼出英文單字：</p>
                    <h4 id="spelling-question-meaning" class="text-2xl font-black text-slate-900 my-2">收集；聚集</h4>
                    <p id="spelling-hint" class="text-sm font-mono text-indigo-500 mt-2 font-semibold">提示：c _ _ _ _ c t</p>
                </div>
                
                <div class="space-y-3">
                    <input type="text" id="user-spelling-input" placeholder="請在此輸入英文拼法..." class="w-full px-5 py-4 bg-slate-50 border-2 border-indigo-100 rounded-2xl text-center text-xl font-bold uppercase focus:outline-none focus:border-indigo-500 transition">
                    <button onclick="checkSpelling()" class="w-full py-4 bg-indigo-600 text-white font-black text-lg rounded-2xl shadow-md hover:bg-indigo-700 transition">確定送出</button>
                </div>
            </div>

            <div id="spelling-result-area" class="text-center hidden py-4 space-y-4">
                <p id="spelling-feedback-text" class="text-2xl font-black text-emerald-600">答對了！</p>
                <button onclick="nextSpellingQuestion()" class="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-2xl shadow-md hover:bg-indigo-700 transition">下一題</button>
            </div>

            <button onclick="closeSpellingModal()" class="w-full py-3 bg-slate-100 text-slate-600 font-bold rounded-2xl hover:bg-slate-200 transition mt-2">關閉練習</button>
        </div>
    </div>

    <!-- 底部版權 -->
    <footer class="text-center py-4 text-xs font-medium text-slate-400">
        高中英文核心單字隨身卡 (大字護眼版)
    </footer>

    <script>
        // 完整涵蓋所有上傳頁面的核心單字與例句
        const vocabList = [
            { word: "collect", pos: "v.", phonetic: "[kə`lɛkt]", meaning: "收集；聚集", sentenceEn: "Jeff has the habit of collecting Japanese comic books.", sentenceZh: "(Jeff 有收集日本漫畫書的習慣。)" },
            { word: "transform", pos: "v.", phonetic: "[træns`fɔrm]", meaning: "改造；改變；轉換", sentenceEn: "The government plans to transform the old train station into a subway station.", sentenceZh: "(政府打算將這個舊火車站改造成地鐵站。)" },
            { word: "instruction", pos: "n.", phonetic: "[ɪn`strʌkʃən]", meaning: "指示；用法說明", sentenceEn: "Ryan wasn't able to set up the new computer because he didn't follow the instructions.", sentenceZh: "(Ryan 因為沒按照用法說明，所以無法安裝這臺新電腦。)" },
            { word: "import", pos: "v.", phonetic: "[ɪm`pɔrt]", meaning: "進口", sentenceEn: "The ingredients that are used in this restaurant are imported from Thailand.", sentenceZh: "(這間餐廳裡所使用的食材是從泰國進口的。)" },
            { word: "delivery", pos: "n.", phonetic: "[dɪ`lɪvərɪ]", meaning: "送貨；交貨；傳送", sentenceEn: "People who are busy and don't have time to cook usually rely on a dinner delivery service.", sentenceZh: "(忙碌及沒時間烹飪的人們通常依靠晚餐送貨服務。)" },
            { word: "opinion", pos: "n.", phonetic: "[ə`pɪnjən]", meaning: "意見；想法", sentenceEn: "The mayor welcomed everyone to share their opinions about building an indoor park in the center of the city.", sentenceZh: "(市長歡迎大家分享關於在市中心建造一座室內公園的想法。)" },
            { word: "dial", pos: "v.", phonetic: "[`daɪəl]", meaning: "撥打；打電話", sentenceEn: "In an emergency, people in the U.S. dial 911, while people in the U.K. dial 999.", sentenceZh: "(有緊急事件時，美國人撥 911，而英國人撥 999。)" },
            { word: "account", pos: "n.", phonetic: "[ə`kaʊnt]", meaning: "帳戶；用戶", sentenceEn: "When I was a child, my parents opened a bank account for me to deposit my money.", sentenceZh: "(在我小時候，我父母開立一個銀行帳戶讓我存錢。)" },
            { word: "register", pos: "v.", phonetic: "[`rɛdʒɪstɚ]", meaning: "註冊；登記", sentenceEn: "To become a member, you must register online and fill in your personal information.", sentenceZh: "(你必須在線上註冊並填寫你的個人資料才能成為會員。)" },
            { word: "unique", pos: "adj.", phonetic: "[ju`nik]", meaning: "獨一無二的；獨特的", sentenceEn: "The modern design of the library makes it one of the most unique buildings in the city.", sentenceZh: "(這間圖書館的現代設計使其成為這個城市裡獨特的建築之一。)" },
            { word: "anniversary", pos: "n.", phonetic: "[ˌænə`vɝsərɪ]", meaning: "週年紀念", sentenceEn: "The department store's anniversary sale is expected to break previous sales records.", sentenceZh: "(這間百貨公司的週年特賣預期可以打破之前的銷售紀錄。)" },
            { word: "trend", pos: "n.", phonetic: "[trɛnd]", meaning: "趨勢", sentenceEn: "Jeans have become a fashion trend since the 1920s. Now, they come in different styles and forms.", sentenceZh: "(牛仔褲自一九二○年代就成為時尚趨勢。現在，牠們以不同風格及形式呈現。)" },
            { word: "leisure", pos: "n.", phonetic: "[`liʒɚ]", meaning: "休閒；空間", sentenceEn: "I feel more comfortable in leisure clothes than in formal clothes.", sentenceZh: "(比起正式服裝，我穿休閒服比較舒適。)" },
            { word: "natural", pos: "adj.", phonetic: "[`nætʃərəl]", meaning: "自然的；天然的", sentenceEn: "Doctors suggest that babies play with objects that are made of natural materials.", sentenceZh: "(醫生建議嬰兒玩天然材質製成的物品。)" },
            { word: "confident", pos: "adj.", phonetic: "[`kanfədənt]", meaning: "有信心的；有把握的", sentenceEn: "After practicing our dance for weeks, we are confident of winning the competition.", sentenceZh: "(經過好幾週的練習，我們對贏得比賽有信心。)" },
            { word: "clear", pos: "adj.", phonetic: "[klɪr]", meaning: "清楚的；明確的；清澈的", sentenceEn: "The coach's instructions were clear and easy to follow.", sentenceZh: "(教練的指示很清楚且很容易做到。)" },
            { word: "simple", pos: "adj.", phonetic: "[`sɪmpl]", meaning: "簡單的；簡樸的", sentenceEn: "Cooking is not difficult; it is actually very simple.", sentenceZh: "(烹飪並不難；事實上它非常簡單。)" },
            { word: "return", pos: "v.", phonetic: "[rɪ`tɝn]", meaning: "退回；歸還；返回", sentenceEn: "William couldn't borrow any books from the library because he hadn't returned the books that he borrowed the last time.", sentenceZh: "(William 不能從圖書館借書，因為他並未還他上次借的書。)" },
            { word: "refund", pos: "v.", phonetic: "[rɪ`fʌnd]", meaning: "退款；退還", sentenceEn: "The store wouldn't refund the money for the sweater because Brenda had cut off the label.", sentenceZh: "(因為 Brenda 已經剪了標籤，這間店不會退還毛衣的錢。)" },
            { word: "replace", pos: "v.", phonetic: "[rɪ`ples]", meaning: "替換；取代", sentenceEn: "Many paper dictionaries have been replaced by online dictionaries.", sentenceZh: "(許多紙本書典已經被線上字典取代。)" },
            { word: "supply", pos: "v.", phonetic: "[sə`plaɪ]", meaning: "供應；提供", sentenceEn: "The factory supplies safety masks and helmets to all of its workers.", sentenceZh: "(這間工廠提供所有的工人安全面罩和安全帽。)" },
            { word: "entertainment", pos: "n.", phonetic: "[ˌɛntɚ`tɛnmənt]", meaning: "娛樂", sentenceEn: "The entertainment program for children must be educational and entertaining.", sentenceZh: "(孩童的娛樂節目必須要具教育性和娛樂性。)" },
            { word: "present", pos: "v.", phonetic: "[prɪ`zɛnt]", meaning: "出示；呈現；提出", sentenceEn: "The employee presented his name card and got a discount on his meal.", sentenceZh: "(這位員工出示他的名片並獲得餐點折扣。)" },
            { word: "respect", pos: "v.", phonetic: "[rɪ`spɛkt]", meaning: "尊重", sentenceEn: "Please respect my privacy and don't read my diary without permission.", sentenceZh: "(請尊重我的隱私且未經許可不要閱讀我的日記。)" },
            { word: "aware", pos: "adj.", phonetic: "[ə`wɛr]", meaning: "注意到……", sentenceEn: "Becky wasn't aware of the importance of studying until she failed the course.", sentenceZh: "(Becky 沒有注意到讀書的重要性直到她的課被當。)" },
            { word: "personal", pos: "adj.", phonetic: "[`pɝsənəl]", meaning: "個人的；私人的", sentenceEn: "Nick shared his personal experience with us and helped us solve our problem.", sentenceZh: "(Nick 跟我們分享了他的個人經驗且幫助我們解決我們的問題。)" },
            { word: "belongings", pos: "n.", phonetic: "[bə`lɔŋɪŋz]", meaning: "財物；所有物；財產", sentenceEn: "Check to see if you have taken all your belongings with you before getting off the bus.", sentenceZh: "(在下公車前請檢查你是否將所有的財物都帶在身上。)" },
            { word: "guest", pos: "n.", phonetic: "[gɛst]", meaning: "旅客；客人", sentenceEn: "Sara invited fifteen guests to her birthday party.", sentenceZh: "(Sara 邀請了十五位客人參加她的生日派對。)" },
            { word: "type", pos: "n.", phonetic: "[taɪp]", meaning: "類型；種類", sentenceEn: "Iris is not my type of girl; I like girls with curly hair.", sentenceZh: "(Iris 不是我喜歡女孩的類型；我喜歡捲髮的女生。)" },
            { word: "standard", pos: "adj.", phonetic: "[`stændɚd]", meaning: "標準的", sentenceEn: "The beds sold in the furniture store are standard size. If you want a bigger one, you must have it specially made.", sentenceZh: "(這間傢俱店賣的床都是標準尺寸。如果你想要更大的床，你必須特別訂製。)" },
            { word: "search", pos: "v.", phonetic: "[sɝtʃ]", meaning: "尋找；搜索", sentenceEn: "Lily spent the whole day in the department store searching for the perfect dress to wear to her friend's wedding.", sentenceZh: "(Lily 在百貨公司花了一整天尋找要穿去她朋友婚禮的完美洋裝。)" },
            { word: "rating", pos: "n.", phonetic: "[`retɪŋ]", meaning: "評價", sentenceEn: "The little restaurant on the corner of the street has a one-star rating by Michelin.", sentenceZh: "(街角的小餐廳擁有米其林一顆星評價。)" },
            { word: "excellent", pos: "adj.", phonetic: "[`ɛkslənt]", meaning: "極好的；傑出的", sentenceEn: "The beach in Kenting is an excellent location for water sports.", sentenceZh: "(墾丁的海灘是水上運動極好的地點。)" },
            { word: "procedure", pos: "n.", phonetic: "[prə`sidʒɚ]", meaning: "程序；步驟；過程", sentenceEn: "\"SOP\" stands for standard operating procedure.", sentenceZh: "(\"SOP\" 代表「標準操作程序」。)" },
            { word: "apply", pos: "v.", phonetic: "[ə`plaɪ]", meaning: "申請；應用", sentenceEn: "To get a discount, please apply for a membership first.", sentenceZh: "(想要折扣，請先申請會員資格。)" },
            { word: "complete", pos: "v.", phonetic: "[kəm`plit]", meaning: "完成；使完整", sentenceEn: "Each team is required to complete their science project in a limited time.", sentenceZh: "(每一支隊伍被要求在限定時間內完成他們的科學作品。)" },
            { word: "form", pos: "n.", phonetic: "[fɔrm]", meaning: "表格；形式", sentenceEn: "Our teacher asked us to fill out many forms on the first day of school.", sentenceZh: "(在開學的第一天，我們的老師要求我們填寫許多表格。)" },
            { word: "review", pos: "v.", phonetic: "[rɪ`vju]", meaning: "審核；複習；檢閱", sentenceEn: "The teacher reviewed the chapters that would appear on the exam.", sentenceZh: "(這位老師會複習會出現在考試上的章節。)" },
            { word: "send", pos: "v.", phonetic: "[sɛnd]", meaning: "寄；發送", sentenceEn: "My best friend sent me lots of postcards from her trip to Australia.", sentenceZh: "(我最好的朋友在澳洲旅行時寄了很多明信片給我。)" },
            { word: "proof", pos: "n.", phonetic: "[pruf]", meaning: "證明；證據", sentenceEn: "The boss had proof that the employee was stealing, so he had no choice but to fire him.", sentenceZh: "(老闆擁有這名員工偷竊的證據，因此他別無選擇只能開除他。)" },
            { word: "popular", pos: "adj.", phonetic: "[`papjəlɚ]", meaning: "受歡迎的", sentenceEn: "Mickey Mouse is very popular among children throughout the world.", sentenceZh: "(米老鼠在世界各地非常受小孩歡迎。)" },
            { word: "booking", pos: "n.", phonetic: "[`bukɪŋ]", meaning: "訂位；預約", sentenceEn: "I made a dinner reservation through the booking system on the Internet.", sentenceZh: "(我透過網路上的訂位系統預約約晚餐。)" },
            { word: "local", pos: "adj.", phonetic: "[`lokəl]", meaning: "本市的；當地的", sentenceEn: "Tourists from other countries come to Taiwan to taste our local snacks and beverages.", sentenceZh: "(來自其他國家的旅客到臺灣來品嘗我們本土的小吃和飲料。)" },
            { word: "abroad", pos: "adv.", phonetic: "[ə`brɔd]", meaning: "在國外", sentenceEn: "Many high school students are interested in the idea of studying at colleges abroad.", sentenceZh: "(很多高中生對在國外讀大學的想法有興趣。)" },
            { word: "guarantee", pos: "v.", phonetic: "[ˌgærən`ti]", meaning: "保證", sentenceEn: "Labels with MIT (Made in Taiwan) on them guarantee high quality and great service.", sentenceZh: "(標牌上寫著臺灣製造保證高品質及良好服務。)" },
            { word: "value", pos: "n.", phonetic: "[`vælju]", meaning: "價格；價值", sentenceEn: "The antique vases in the museum have a high value because they were treasures belonging to the royal family.", sentenceZh: "(這間博物館內的古董花瓶有著很高的價值，因為它們以前是屬於王室家族的寶物。)" },
            { word: "upgrade", pos: "v.", phonetic: "[`ʌp`grɛd]", meaning: "升級", sentenceEn: "I paid $100 to upgrade my music app so that I can download more songs.", sentenceZh: "(為了可以下載更多的歌曲，我付了一百元升級我的音樂應用程式。)" },
            { word: "distance", pos: "n.", phonetic: "[`dɪstəns]", meaning: "距離", sentenceEn: "The distance between my home and school is too far to walk; therefore, I must take the bus every day.", sentenceZh: "(我家和學校之間的距離遠到無法路抵達；因此，我必須每天搭公車。)" },
            { word: "downtown", pos: "n.", phonetic: "[ˌdaʊn`taʊn]", meaning: "市區；市中心", sentenceEn: "Some people prefer to live in the suburbs since it is too crowded in the city's downtown.", sentenceZh: "(有些人較偏愛住在郊區，因為市區太擁擠了。)" },
            { word: "internet", pos: "n.", phonetic: "[`ɪntɚˌnɛt]", meaning: "網際網路", sentenceEn: "Meeting people through the Internet could be dangerous if you are not careful.", sentenceZh: "(透過網路交友若不謹慎是危險的。)" },
            { word: "connection", pos: "n.", phonetic: "[kə`nɛkʃən]", meaning: "連線；連結；結合", sentenceEn: "The only connection between the two cities is the long bridge.", sentenceZh: "(這兩個城市間的唯一連結是這座長橋。)" },
            { word: "nearby", pos: "adj.", phonetic: "[`nɪr`baɪ]", meaning: "附近的", sentenceEn: "All nearby stores are closed. Maybe you should go to a 24-hour convenience store to buy food.", sentenceZh: "(所有附近的商店都關門了。也許你該去二十四小時營業的便利商店買食物。)" },
            { word: "site", pos: "n.", phonetic: "[saɪt]", meaning: "景點；地點；場所", sentenceEn: "Taipei 101 is a well-known check-in site for foreigners.", sentenceZh: "(臺北 101 對外國人來說個知名的打卡景點。)" },
            { word: "compare", pos: "v.", phonetic: "[kəm`pɛr]", meaning: "比較；相比", sentenceEn: "My parents are always comparing my grades with my cousin's because they hope I can pay more attention to my studies.", sentenceZh: "(我父母總是拿我的成績和我表妹的比較，因為他們希望我可以更專注我的學業。)" },
            { word: "responsible", pos: "adj.", phonetic: "[rɪ`spɑnsəbl]", meaning: "負責的；可靠的", sentenceEn: "Ted is responsible for the recycling job in the class.", sentenceZh: "(Ted 負責班上的回收工作。)" },
            { word: "shipping", pos: "n.", phonetic: "[`ʃɪpɪŋ]", meaning: "運送；運輸", sentenceEn: "Shipping costs are cheaper by sea, but it takes longer.", sentenceZh: "(海運費用較便宜，但它所需時間較久。)" },
            { word: "charge", pos: "n.", phonetic: "[tʃɑrdʒ]", meaning: "費用", sentenceEn: "When eating in all-you-can-eat restaurants, you will need to pay an extra charge if you waste food.", sentenceZh: "(在吃到飽餐廳用餐時，若你浪費食物將需要支付額外費用。)" },
            { word: "condition", pos: "n.", phonetic: "[kən`dɪʃən]", meaning: "狀態；物質條件", sentenceEn: "People in developed countries usually have better living conditions.", sentenceZh: "(已開發國家的人民通常有較好的生活條件。)" },
            { word: "accept", pos: "v.", phonetic: "[ək`sɛpt]", meaning: "接受；同意", sentenceEn: "Snack vendors in night markets don't accept credit cards, so you had better bring cash with you.", sentenceZh: "(夜市小吃攤販不接受信用卡，所以最好帶現金在身上。)" },
            { word: "receive", pos: "v.", phonetic: "[rɪ`siv]", meaning: "收到；得到", sentenceEn: "Patrick received a motorcycle as a gift from his parents on his birthday.", sentenceZh: "(Patrick 在他生日時收到他父母送他摩托車做為禮物。)" },
            { word: "within", pos: "prep.", phonetic: "[wɪ`ðɪn]", meaning: "在……之內；在……裡面", sentenceEn: "Soldiers in the army must finish their shower within ten minutes.", sentenceZh: "(軍隊裡的士兵必須在十分鐘之內洗完澡。)" },
            { word: "average", pos: "n.", phonetic: "[`ævərɪdʒ]", meaning: "平均；平均數", sentenceEn: "It is suggested that students get an average of eight hours of sleep a day to stay focused in class.", sentenceZh: "(建議學生一天平均睡眠八小時以便在課堂上能專注。)" },
            { word: "performance", pos: "n.", phonetic: "[pɚ`fɔrməns]", meaning: "表現；表演", sentenceEn: "The famous band will hold a public performance in the park this weekend.", sentenceZh: "(這個知名的樂團將於這個週末在公園裡舉辦一個公開表演。)" },
            { word: "improve", pos: "v.", phonetic: "[ɪm`pruv]", meaning: "改進；增進；提升", sentenceEn: "Serena's math grades improved after her mother hired a tutor to teach her.", sentenceZh: "(Serena 在她母親僱用家教教她後，她的數學成績進步了。)" },
            { word: "professional", pos: "adj.", phonetic: "[prə`fɛʃənəl]", meaning: "專業的", sentenceEn: "Vocational high school is the perfect place for students to cultivate professional skills.", sentenceZh: "(技術高級中學是個讓學生培育專業技能的理想地方。)" },
            { word: "attitude", pos: "n.", phonetic: "[`ætəˌtud]", meaning: "態度；想法", sentenceEn: "The key to Kyle's success was his positive attitude.", sentenceZh: "(Kyle 成功的關鍵是他的正面態度。)" },
            { word: "quality", pos: "n.", phonetic: "[`kwɑlətɪ]", meaning: "品質；特質", sentenceEn: "The quality of the handmade sandals is better than we thought.", sentenceZh: "(手工涼鞋的品質比我們原先想的好。)" },
            { word: "reward", pos: "n.", phonetic: "[rɪ`wɔrd]", meaning: "獎品；獎勵；報答", sentenceEn: "The little boy received a reward after returning the money he found to the police.", sentenceZh: "(這位小男孩因為將他發現的錢歸還給警察而得到獎勵。)" },
            { word: "basic", pos: "adj.", phonetic: "[`besɪk]", meaning: "基本的；基礎的", sentenceEn: "Many universities require that students have basic English speaking ability before they graduate.", sentenceZh: "(許多大學要求學生在他們畢業前要有基本的英語口說能力。)" },
            { word: "athlete", pos: "n.", phonetic: "[`æθlit]", meaning: "運動員；體育選手", sentenceEn: "Peter is the most outstanding athlete in the class. He has won many sports competitions.", sentenceZh: "(Peter 是班上傑出的運動員。他贏了許多運動比賽。)" },
            { word: "protect", pos: "v.", phonetic: "[prə`tɛkt]", meaning: "保護", sentenceEn: "We applied some sunscreen on our skin to protect it from the blazing sun.", sentenceZh: "(我們抹了一些防曬液在我們的皮膚上以保護它不要被炙熱的太陽傷害。)" },
            { word: "environment", pos: "n.", phonetic: "[ɪn`vaɪrənmənt]", meaning: "環境", sentenceEn: "My teacher always requires us to keep our learning environment clean and tidy.", sentenceZh: "(我的老師總是要求我們要將學習環境保持乾淨又整潔。)" },
            { word: "used", pos: "adj.", phonetic: "[juzd]", meaning: "二手的；用過的", sentenceEn: "The old bookstore in this alley sells used books and magazines.", sentenceZh: "(這條巷子裡的舊書店賣的是二手書及雜誌。)" },
            { word: "organic", pos: "adj.", phonetic: "[ɔr`gænɪk]", meaning: "有機的", sentenceEn: "Fruits and vegetables that are sold in organic stores are more expensive than those in traditional markets.", sentenceZh: "(有機店裡的水果及蔬菜比傳統市場賣的還貴。)" },
            { word: "disturb", pos: "v.", phonetic: "[dɪs`tɝb]", meaning: "打擾", sentenceEn: "It is impolite to disturb others during nap time.", sentenceZh: "(在午休時間打擾他人是不禮貌的。)" },
            { word: "expect", pos: "v.", phonetic: "[ɪk`spɛkt]", meaning: "預期；期待；期望", sentenceEn: "Fiona is expecting a letter from her pen pal.", sentenceZh: "(Fiona 正在期待她筆友的來信。)" },
            { word: "inform", pos: "v.", phonetic: "[ɪn`fɔrm]", meaning: "告知", sentenceEn: "If there are any changes in the plan, we will inform you.", sentenceZh: "(如果計畫有任何改變，我們會告知你。)" },
            { word: "store", pos: "v.", phonetic: "[stɔr]", meaning: "存放；儲存", sentenceEn: "My clothes are stored in different places in my closet according to season.", sentenceZh: "(我的衣服依據季節分類存放在我衣櫃的不同地方。)" },
            { word: "damage", pos: "n.", phonetic: "[`dæmɪdʒ]", meaning: "損害；毀損", sentenceEn: "Evan was responsible for the damage he had caused.", sentenceZh: "(Evan 要為他造成的損害負責。)" },
            { word: "reputation", pos: "n.", phonetic: "[ˌrɛpju`teʃən]", meaning: "名譽；名聲；聲譽", sentenceEn: "Victor wants to apply to a university with a good reputation.", sentenceZh: "(Victor 想申請一間具有好名聲的大學。)" }
        ];

        let currentIndex = 0;
        let isFlipped = false;
        let favorites = JSON.parse(localStorage.getItem('vocab_favorites_all') || '[]');
        let showFavoritesOnly = false;
        let currentFilteredList = [...vocabList];
        let autoPlayTimer = null;
        let isAutoPlaying = false;

        const flashcard = document.getElementById('flashcard');
        const wordEl = document.getElementById('card-word');
        const posEl = document.getElementById('card-pos');
        const phoneticEl = document.getElementById('card-phonetic');
        const meaningEl = document.getElementById('card-meaning');
        const sentenceEnEl = document.getElementById('card-sentence-en');
        const sentenceZhEl = document.getElementById('card-sentence-zh');
        const counterEl = document.getElementById('counter');
        const favBtn = document.getElementById('fav-btn');
        const favFilterBtn = document.getElementById('fav-filter-btn');
        const autoplayBtn = document.getElementById('autoplay-btn');

        function updateCard() {
            if (currentFilteredList.length === 0) {
                wordEl.innerText = "沒有單字";
                posEl.innerText = "-";
                phoneticEl.innerText = "";
                meaningEl.innerText = "找不到符合的單字";
                sentenceEnEl.innerText = "";
                sentenceZhEl.innerText = "";
                counterEl.innerText = "0 / 0";
                return;
            }

            if (currentIndex >= currentFilteredList.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = currentFilteredList.length - 1;

            const item = currentFilteredList[currentIndex];
            wordEl.innerText = item.word;
            posEl.innerText = item.pos;
            phoneticEl.innerText = item.phonetic;
            meaningEl.innerText = item.meaning;
            sentenceEnEl.innerText = item.sentenceEn;
            sentenceZhEl.innerText = item.sentenceZh;
            counterEl.innerText = `${currentIndex + 1} / ${currentFilteredList.length}`;

            if (favorites.includes(item.word)) {
                favBtn.innerText = "★";
                favBtn.classList.add("text-amber-400");
                favBtn.classList.remove("text-slate-300");
            } else {
                favBtn.innerText = "★";
                favBtn.classList.remove("text-amber-400");
                favBtn.classList.add("text-slate-300");
            }

            if (isFlipped) {
                flipCard(true);
            }
        }

        function flipCard(forceReset = false) {
            if (forceReset) {
                isFlipped = false;
                flashcard.style.transform = "rotateY(0deg)";
                return;
            }
            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcard.style.transform = "rotateY(180deg)";
            } else {
                flashcard.style.transform = "rotateY(0deg)";
            }
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % currentFilteredList.length;
            updateCard();
            if (isAutoPlaying) speakCurrentWord();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + currentFilteredList.length) % currentFilteredList.length;
            updateCard();
        }

        function toggleFavorite() {
            const item = currentFilteredList[currentIndex];
            if (!item) return;
            const index = favorites.indexOf(item.word);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(item.word);
            }
            localStorage.setItem('vocab_favorites_all', JSON.stringify(favorites));
            updateCard();
        }

        function toggleFavoritesView() {
            showFavoritesOnly = !showFavoritesOnly;
            if (showFavoritesOnly) {
                currentFilteredList = vocabList.filter(item => favorites.includes(item.word));
                favFilterBtn.classList.add("bg-amber-500", "text-white");
                favFilterBtn.classList.remove("bg-amber-100", "text-amber-800");
            } else {
                currentFilteredList = [...vocabList];
                favFilterBtn.classList.remove("bg-amber-500", "text-white");
                favFilterBtn.classList.add("bg-amber-100", "text-amber-800");
            }
            currentIndex = 0;
            updateCard();
        }

        function handleSearch(query) {
            const q = query.toLowerCase().trim();
            if (!q) {
                currentFilteredList = showFavoritesOnly ? vocabList.filter(item => favorites.includes(item.word)) : [...vocabList];
            } else {
                const baseList = showFavoritesOnly ? vocabList.filter(item => favorites.includes(item.word)) : vocabList;
                currentFilteredList = baseList.filter(item => 
                    item.word.toLowerCase().includes(q) || item.meaning.includes(q)
                );
            }
            currentIndex = 0;
            updateCard();
        }

        // 語音發音
        function speakCurrentWord() {
            if (currentFilteredList.length === 0) return;
            const item = currentFilteredList[currentIndex];
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(item.word);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakSentence() {
            if (currentFilteredList.length === 0) return;
            const item = currentFilteredList[currentIndex];
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(item.sentenceEn);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 自動循環播放
        function toggleAutoPlay() {
            isAutoPlaying = !isAutoPlaying;
            if (isAutoPlaying) {
                autoplayBtn.classList.add("bg-indigo-600", "text-white");
                autoplayBtn.classList.remove("bg-white", "text-indigo-700");
                speakCurrentWord();
                autoPlayTimer = setInterval(() => {
                    nextCard();
                }, 4000);
            } else {
                autoplayBtn.classList.remove("bg-indigo-600", "text-white");
                autoplayBtn.classList.add("bg-white", "text-indigo-700");
                clearInterval(autoPlayTimer);
            }
        }

        // 拼字練習邏輯
        let currentSpellingItem = null;
        function openSpellingModal() {
            document.getElementById('spelling-modal').classList.remove('hidden');
            document.getElementById('spelling-content').classList.remove('hidden');
            document.getElementById('spelling-result-area').classList.add('hidden');
            document.getElementById('user-spelling-input').value = '';
            generateSpellingQuestion();
        }

        function closeSpellingModal() {
            document.getElementById('spelling-modal').classList.add('hidden');
        }

        function generateSpellingQuestion() {
            const randomIndex = Math.floor(Math.random() * vocabList.length);
            currentSpellingItem = vocabList[randomIndex];
            document.getElementById('spelling-question-meaning').innerText = currentSpellingItem.meaning;

            const word = currentSpellingItem.word;
            let hint = word[0] + " " + word.slice(1, -1).split('').map(() => "_").join(" ") + " " + word[word.length - 1];
            if (word.length <= 2) {
                hint = word[0] + " _";
            }
            document.getElementById('spelling-hint').innerText = `提示：${hint} (共 ${word.length} 個字母)`;
            document.getElementById('user-spelling-input').value = '';
        }

        function checkSpelling() {
            const userVal = document.getElementById('user-spelling-input').value.trim().toLowerCase();
            const resultArea = document.getElementById('spelling-result-area');
            const feedbackText = document.getElementById('spelling-feedback-text');
            
            document.getElementById('spelling-content').classList.add('hidden');
            resultArea.classList.remove('hidden');

            if (userVal === currentSpellingItem.word.toLowerCase()) {
                feedbackText.innerText = `🎉 太棒了！拼寫完全正確！ (${currentSpellingItem.word})`;
                feedbackText.className = "text-2xl font-black text-emerald-600";
                
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(currentSpellingItem.word);
                    utterance.lang = 'en-US';
                    window.speechSynthesis.speak(utterance);
                }
            } else {
                feedbackText.innerHTML = `❌ 答錯囉！正確拼法是：<br><span class="text-indigo-600 text-3xl">${currentSpellingItem.word}</span>`;
                feedbackText.className = "text-xl font-black text-rose-600";
            }
        }

        function nextSpellingQuestion() {
            document.getElementById('spelling-result-area').classList.add('hidden');
            document.getElementById('spelling-content').classList.remove('hidden');
            generateSpellingQuestion();
        }

        window.onload = function() {
            updateCard();
        };
    </script>
</body>
</html>
